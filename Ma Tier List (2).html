<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Tier List</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--fg:#1b1d27;--mut:#6b7080;--line:#d9dce6;--acc:#6c5ce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--card:#1e2029;--fg:#eceef5;--mut:#9094a6;--line:#343748}}
:root[data-theme="dark"]{--bg:#14151c;--card:#1e2029;--fg:#eceef5;--mut:#9094a6;--line:#343748}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mut);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-size:.9rem;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#board{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tier{display:flex;border-bottom:1px solid var(--line);min-height:84px}
.grip{width:24px;flex:none;display:flex;align-items:center;justify-content:center;cursor:grab;color:var(--mut);touch-action:none;user-select:none;border-right:1px solid var(--line);font-size:1.1rem}.grip:hover{background:var(--line)}.tier.moving{opacity:.65;outline:2px solid var(--acc);outline-offset:-2px;position:relative;z-index:5}
.label{width:90px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:1.2rem;padding:6px;color:#111;outline:none;word-break:break-word}
.items{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:4px;align-content:flex-start;min-height:80px}
.tools{width:42px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-left:1px solid var(--line)}
.tools input{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer}
.tools span{cursor:pointer;color:var(--fg);font-size:1.1rem;width:30px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line)}.tools span:hover{background:var(--line)}
#pool{margin-top:14px;border:2px dashed var(--line);border-radius:10px;padding:6px;min-height:96px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.item{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;background:#000;flex:none}
.item img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.item .play{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:20px;height:20px;font-size:10px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.item .x{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;display:none}
.item:hover .x{display:block}
.item.hold{opacity:.3}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:scale(1.08);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.on{display:flex}
#modal video,#modal img{max-width:100%;max-height:100%;border-radius:8px;background:#000}
#modal .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;font-size:2rem;color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>🏆 Ma Tier List</h1>
  <p class="sub">Ajoute des images ou des vidéos, glisse-les dans les tiers. Un simple clic sur une vidéo l'ouvre en grand et la lance.</p>
  <div class="bar">
    <label class="btn">＋ Images / vidéos<input id="file" type="file" accept="image/*,video/*" multiple hidden></label>
    <button class="sec" id="addTier">＋ Ajouter un tier</button>
    <button class="sec" id="reset">Tout remettre dans la réserve</button>
  </div>
  <div id="board"></div>
  <div id="pool" class="drop"></div>
</main>
<div id="modal"><span class="close">×</span></div>
<script>
const board=document.getElementById('board'),pool=document.getElementById('pool'),modal=document.getElementById('modal');
const defs=[['S','#ff7f7f'],['A','#ffbf7f'],['B','#ffdf7f'],['C','#bfff7f'],['D','#7fbfff']];
function addTier(l,c,after){
  const t=document.createElement('div');t.className='tier';
  t.innerHTML='<div class="grip" title="Glisser pour déplacer ce tier">⠿</div><div class="label" contenteditable="true" spellcheck="false"></div><div class="items drop"></div><div class="tools"><input type="color"><span class="ins" title="Ajouter un tier en dessous">＋</span><span class="del" title="Supprimer ce tier">🗑</span></div>';
  const lab=t.querySelector('.label');lab.textContent=l;lab.style.background=c;
  const ci=t.querySelector('input');ci.value=c;ci.oninput=()=>lab.style.background=ci.value;
  t.querySelector('.grip').onpointerdown=e=>{
    e.preventDefault();t.classList.add('moving');
    const move=ev=>{
      let ref=null;
      for(const o of [...board.children].filter(x=>x!==t)){const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){ref=o;break}}
      board.insertBefore(t,ref);
    };
    const up=()=>{removeEventListener('pointermove',move);t.classList.remove('moving')};
    addEventListener('pointermove',move);addEventListener('pointerup',up,{once:true});
  };
  t.querySelector('.ins').onclick=()=>addTier('Nouveau','#c9b6ff',t);
  t.querySelector('.del').onclick=()=>{t.querySelectorAll('.item').forEach(i=>pool.appendChild(i));t.remove()};
  after?board.insertBefore(t,after.nextSibling):board.appendChild(t);
}
defs.forEach(d=>addTier(...d));
document.getElementById('addTier').onclick=()=>addTier('Nouveau','#c9b6ff');
document.getElementById('reset').onclick=()=>document.querySelectorAll('#board .item').forEach(i=>pool.appendChild(i));

function cover(src,w,h){const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const s=Math.max(160/w,160/h);x.drawImage(src,(160-w*s)/2,(160-h*s)/2,w*s,h*s);return c.toDataURL('image/jpeg',.85)}
function makeItem(thumb,kind,url){
  const el=document.createElement('div');el.className='item';el.dataset.kind=kind;el.dataset.url=url;
  el.innerHTML='<img alt=""><span class="x">×</span>'+(kind==='video'?'<span class="play">▶</span>':'');
  el.querySelector('img').src=thumb;bind(el);pool.appendChild(el);
}
document.getElementById('file').onchange=e=>{
  [...e.target.files].forEach(f=>{
    const url=URL.createObjectURL(f);
    if(f.type.startsWith('video/')){
      const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;v.src=url;
      v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};
      v.onseeked=()=>{makeItem(cover(v,v.videoWidth,v.videoHeight),'video',url);v.onseeked=null};
      v.onerror=()=>alert('Vidéo non lisible : '+f.name);
    }else{
      const i=new Image();i.onload=()=>makeItem(cover(i,i.width,i.height),'image',url);i.src=url;
    }
  });e.target.value='';
};

function bind(el){
  el.onpointerdown=e=>{
    if(e.button!==0)return;
    if(e.target.classList.contains('x')){el.remove();return}
    const sx=e.clientX,sy=e.clientY;let drag=false,g;
    const move=ev=>{
      if(!drag&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){drag=true;g=el.cloneNode(true);g.className='item ghost';document.body.appendChild(g);el.classList.add('hold')}
      if(drag){g.style.left=ev.clientX-38+'px';g.style.top=ev.clientY-38+'px'}
    };
    const up=ev=>{
      removeEventListener('pointermove',move);
      if(drag){
        g.remove();el.classList.remove('hold');
        const t=document.elementFromPoint(ev.clientX,ev.clientY),z=t&&t.closest('.drop');
        if(z){const o=t.closest('.item');(o&&o!==el&&o.parentNode===z)?z.insertBefore(el,o):z.appendChild(el)}
      }else openItem(el);
    };
    addEventListener('pointermove',move);
    addEventListener('pointerup',up,{once:true});
  };
}
function openItem(el){
  const k=el.dataset.kind,m=document.createElement(k==='video'?'video':'img');
  if(k==='video'){m.controls=true;m.autoplay=true;m.playsInline=true}
  m.src=el.dataset.url;modal.appendChild(m);modal.classList.add('on');
}
function closeModal(){modal.classList.remove('on');modal.querySelectorAll('video,img').forEach(m=>{if(m.pause)m.pause();m.remove()})}
modal.onclick=e=>{if(e.target.tagName!=='VIDEO')closeModal()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
